<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Bimba | Mi identificación</title>
  <style>
    :root { color-scheme: light; font-family: Arial, Helvetica, sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: #fffaf7;
      color: #27252a;
      padding: 18px 14px;
    }
    main {
      width: 100%;
      max-width: 410px;
      margin: auto;
      text-align: center;
      background: #ffffff;
      border: 1px solid #f0e5dd;
      border-radius: 22px;
      padding: 25px 19px 22px;
      box-shadow: 0 10px 32px rgba(61, 38, 27, .07);
    }
    .paw { font-size: 38px; line-height: 1; margin-bottom: 12px; }
    h1 { color: #8e4a3d; font-size: clamp(25px, 7vw, 32px); line-height: 1.15; margin: 0 0 12px; }
    p { font-size: 16px; line-height: 1.5; margin: 0; }
    .sub { margin: 0 0 20px; }
    .links { display: grid; gap: 11px; }
    .btn {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 53px;
      padding: 13px 10px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.25;
      text-decoration: none;
      color: #fff;
      transition: filter .12s ease;
    }
    .btn:active { filter: brightness(.9); }
    .btn:focus-visible { outline: 3px solid #1b1b1b; outline-offset: 3px; }
    .whatsapp { background: #137f49; }
    .instagram { background: #7437a3; }
    .empresa { background: #001d5c; }
    .phone { color: #615d5c; font-size: 13px; margin: 8px 0 17px; }
    .foot { color: #80635d; font-size: 13px; margin-top: 20px; }
    @media (max-width: 350px) {
      body { padding: 9px; }
      main { padding: 20px 13px; }
      p { font-size: 15px; }
      .btn { font-size: 15px; }
    }
  </style>
</head>
<body>
  <main aria-label="Identificación de Bimba">
    <div class="paw" aria-hidden="true">🐾</div>
    <h1>¡Hola! Soy Bimba</h1>
    <p class="sub">Si me encontraste, ayudame a volver a casa.<br>
      Mi dueño es <strong>Javier</strong>. Podés escribirle aquí:</p>
    <nav class="links" aria-label="Medios para contactar a Javier">
      <a class="btn whatsapp" href="https://wa.me/595985499985?text=Hola%2C%20Javier.%20Encontr%C3%A9%20a%20Bimba.%20%C2%BFPodemos%20coordinar%20para%20que%20vuelva%20a%20casa%3F" target="_blank" rel="noopener noreferrer">WhatsApp de Javier</a>
      <a class="btn instagram" href="https://www.instagram.com/javier_alonso96/" target="_blank" rel="noopener noreferrer">Instagram de Javier</a>
      <a class="btn empresa" href="https://www.instagram.com/flexbagcdepy/" target="_blank" rel="noopener noreferrer">Instagram de FLEXBAG</a>
    </nav>
    <p class="phone">WhatsApp: +595 985 499985</p>
    <p class="foot">¡Gracias por ayudarme a regresar a casa!</p>
  </main>
</body>
</html>
